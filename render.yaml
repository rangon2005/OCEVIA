services:
  - type: web
    name: ocevia
    runtime: node
    plan: free
    buildCommand: "npm install"
    startCommand: "node tourmate/tourmate-server.js"
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: FIREBASE_DB_URL
        sync: false
      - key: GEE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GEE_PROJECT
        sync: false
